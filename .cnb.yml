# CNB 云原生构建：Android release APK（未签名）
#
# 分工（2026-11-24 用户选定「方案 B」）：
#   CNB  —— 只负责编译，产出**未签名** APK，作为提交附件回传
#   本机 —— 下载、用 release 密钥签名、传 COS、更新清单
#          （tools/pocket/cnb_fetch_sign.py + tools/pocket/release.py）
# 签名密钥与 COS 凭据都不进 CI。
#
# 为什么在 CNB 构建：本机 2 核 / 8 GB 且常驻 DSH(1.5 GB)+Hermes，release 构建
# 峰值 3.5 GB 会把整机压进 swap（40 分钟）；CNB Runner 实测 8 核 / 16 GB。
#
# 触发：main 分支 push（本地 `git push origin main` 同时推到 GitHub 与 CNB）。
#
# 踩坑记录（改之前先读，每条都真实卡过一次）：
#  1. 工具链预烤进镜像（docker/android.Dockerfile），由 build.by 哈希缓存。
#     **不要用数据卷缓存**：容器 userns 重映射导致卷不可写，实测四个卷全退回
#     /tmp，等于没缓存（工具链仍要 13.6 分钟）。
#  2. 基础镜像必须 ubuntu，不能 eclipse-temurin（后者下 Flutter 解压会 ENOSYS）。
#  3. tar 必须 --no-same-owner（镜像里用 TAR_OPTIONS 环境变量）。
#  4. Maven Central 对 CNB 出口限流 429 → 用 .cnb/gradle-mirrors.gradle。
#  5. app/android/gradlew 被 .gitignore 忽略 → 先 `flutter build apk --config-only`。
#  6. 直接调 gradlew 要显式 -PskipDependencyChecks=true 旁路 AGP 版本校验。
#  7. --config-only 不写版本号 → 手动把 pubspec 的版本写进 local.properties。
#  8. 产物在 apk/<abi>/release/ 下，附件插件按相对路径找文件 → 先复制到工作区根。
main:
  push:
    - name: android-release-unsigned
      docker:
        build:
          dockerfile: docker/android.Dockerfile
          # 只有这个文件变了才重建镜像（首次约 20 分钟，之后秒级命中）
          by:
            - docker/android.Dockerfile
      stages:
        - name: 环境自检
          script: |
            set -e
            flutter --version
            echo "ANDROID_HOME=$ANDROID_HOME"

        - name: 配置 Gradle 镜像
          script: |
            set -e
            mkdir -p "$HOME/.gradle/init.d"
            cp .cnb/gradle-mirrors.gradle "$HOME/.gradle/init.d/mirrors.gradle"

        - name: 构建 release（未签名）
          script: |
            set -e
            cd app
            flutter pub get
            # gradlew/local.properties 被 android/.gitignore 忽略，先让 Flutter 生成
            flutter build apk --release --target-platform android-arm64 --config-only
            cd android
            # --config-only 不写版本号，不补的话 APK versionName 会退化成 1.0
            VER=$(sed -n 's/^version: *//p' ../pubspec.yaml)
            VNAME=${VER%%+*}
            VBUILD=${VER##*+}
            sed -i '/^flutter\.version/d' local.properties
            printf 'flutter.versionName=%s\nflutter.versionCode=%s\n' "$VNAME" "$VBUILD" \
              >> local.properties
            echo "版本 $VNAME+$VBUILD"
            # -PskipDependencyChecks=true == flutter --android-skip-build-dependency-validation
            ./gradlew --no-daemon assembleRelease \
              -Punsigned -PskipDependencyChecks=true -Ptarget-platform=android-arm64
            APK=$(find ../build/app/outputs -path '*arm64/release*' -name '*.apk' | head -1)
            [ -n "$APK" ] || APK=$(find ../build/app/outputs -path '*release*' -name '*.apk' | head -1)
            echo "APK=$APK"
            sha256sum "$APK"
            cp "$APK" ../../app-release-unsigned.apk
            ls -l ../../app-release-unsigned.apk

        - name: 回传未签名 APK（提交附件）
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./app-release-unsigned.apk"
