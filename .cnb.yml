main:
  push:
    - name: tar-diagnose-2
      docker:
        image: ubuntu:24.04
      stages:
        - name: 分别解到 /tmp /root /opt /workspace
          script: |
            set -e
            apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq tar gzip curl >/dev/null 2>&1
            curl -sSL -o /tmp/gw.tgz https://storage.flutter-io.cn/flutter_infra_release/gradle-wrapper/fd5c1f2c013565a3bea56ada6df9d2b8e96d56aa/gradle-wrapper.tgz
            for D in /tmp/t /root/r /opt/o /workspace/w; do
              echo "=== $D ==="
              rm -rf "$D"; mkdir -p "$D"
              if tar xzf /tmp/gw.tgz -C "$D"; then echo "  OK: $(find $D -type f | wc -l) files"; else echo "  FAILED"; fi
            done
            echo "=== 深层 mkdir 测试（模拟 flutter 的 artifacts 路径）==="
            mkdir -p /root/flutter/bin/cache/artifacts/gradle_wrapper && echo "  深路径 mkdir OK"
            tar xzf /tmp/gw.tgz -C /root/flutter/bin/cache/artifacts/gradle_wrapper && echo "  深路径 tar OK"
            echo "=== DONE ==="
