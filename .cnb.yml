main:
  push:
    - name: tar-diagnose
      docker:
        image: ubuntu:24.04
      stages:
        - name: tar 最小复现
          script: |
            set -x
            apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq tar gzip curl >/dev/null 2>&1
            echo "--- id ---"; id
            echo "--- mount ---"; mount | grep -E " / | /root| /workspace| /tmp" | head -6
            echo "--- 本地 tar 往返 ---"
            mkdir -p /tmp/t1/gradle/wrapper && echo hi > /tmp/t1/gradle/wrapper/f
            tar czf /tmp/t.tgz -C /tmp/t1 gradle
            mkdir -p /tmp/t2 && tar xzf /tmp/t.tgz -C /tmp/t2 && find /tmp/t2 -type f
            echo "--- 下真实 gradle-wrapper.tgz 再解 ---"
            curl -sSL -o /tmp/gw.tgz https://storage.flutter-io.cn/flutter_infra_release/gradle-wrapper/fd5c1f2c013565a3bea56ada6df9d2b8e96d56aa/gradle-wrapper.tgz
            ls -l /tmp/gw.tgz; file /tmp/gw.tgz
            mkdir -p /tmp/gw && tar xzf /tmp/gw.tgz -C /tmp/gw && find /tmp/gw -type f
            echo "--- 解到 /workspace 下 ---"
            mkdir -p /workspace/gwtest && tar xzf /tmp/gw.tgz -C /workspace/gwtest && find /workspace/gwtest -type f
            echo "--- DONE ---"
