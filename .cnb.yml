# CNB 云原生构建：Android release APK（未签名）
#
# 分工（2026-11-24 用户选定「方案 B」）：
#   CNB  —— 只负责编译，产出**未签名** APK，作为提交附件回传
#   本机 —— 下载、用 release 密钥签名、传 COS、更新清单
#          （tools/pocket/cnb_fetch_sign.py + tools/pocket/release.py）
# 签名密钥与 COS 凭据都不进 CI。
#
# 三层加速（都按官方文档来做，见 docs.cnb.cool）：
#  1. 工具链预烤进镜像 docker/android.Dockerfile，用 docker.build + by 缓存
#     （文档：build/grammar.md#pipeline-build）。实测 Prepare 9.9m → 35.8s。
#  2. Gradle / pub 依赖用 copy-on-write 数据卷缓存
#     （文档：build/pipeline-cache.md「文件缓存」，官方 Flutter 示例同款）。
#  3. 只编 arm64 flavor：ABI 在 app/build.gradle.kts 里是 productFlavor，
#     assembleRelease 会连 x64 一起编，用 assembleArm64Release 省掉一半打包。
#
# 触发：main 分支 push（本地 git push origin main 同时推到 GitHub 与 CNB）。
#
# 其它踩坑（改之前先读）：
#  - 基础镜像必须 ubuntu，eclipse-temurin 下 Flutter 解压会报 ENOSYS。
#  - tar 必须 --no-same-owner（镜像里已设 TAR_OPTIONS）。
#  - Maven Central 对 CNB 出口限流 429 → .cnb/gradle-mirrors.gradle 走阿里云。
#  - app/android/gradlew 被 .gitignore 忽略 → 先 flutter build --config-only 生成。
#  - 直接调 gradlew 要 -PskipDependencyChecks=true 旁路 AGP 版本校验。
#  - --config-only 不写版本号 → 手动写进 local.properties。
#  - 产物在 apk/<flavor>/release/ 下，附件插件按相对路径找 → 先复制到工作区根。
main:
  push:
    - name: android-release-unsigned
      # 只有可能影响 APK 的文件变动才触发（文档：grammar.md#ifModify）。
      # 改 README/CHANGELOG/docs/tools 不构建，省一次 17 分钟的跑。
      # 注意：新建分支的 push 没有对比基准，此检查会被忽略（文档明确写了）。
      ifModify:
        - "app/**"
        - "packages/**"
        - "docker/**"
        - ".cnb.yml"
        - ".cnb/**"
      docker:
        build:
          dockerfile: docker/android.Dockerfile
          by:
            - docker/android.Dockerfile
        # 依赖目录缓存到构建节点（官方 pipeline-cache 文档的「文件缓存」）
        volumes:
          - /root/.gradle:copy-on-write
          - /root/.pub-cache:copy-on-write
      stages:
        - name: 环境自检
          script: |
            set -e
            flutter --version
            java -version 2>&1 | head -2
            echo "gradle 缓存目录: $(du -sh "$HOME/.gradle" 2>/dev/null | cut -f1 || echo 空)"
            echo "pub 缓存目录:    $(du -sh "$HOME/.pub-cache" 2>/dev/null | cut -f1 || echo 空)"

        - name: 配置 Gradle 镜像
          script: |
            set -e
            mkdir -p "$HOME/.gradle/init.d"
            cp .cnb/gradle-mirrors.gradle "$HOME/.gradle/init.d/mirrors.gradle"

        - name: 构建 release（未签名）
          script: |
            set -e
            cd app
            flutter pub get
            flutter build apk --release --target-platform android-arm64 --config-only
            cd android
            VER=$(sed -n 's/^version: *//p' ../pubspec.yaml)
            sed -i '/^flutter\.version/d' local.properties
            printf 'flutter.versionName=%s\nflutter.versionCode=%s\n' \
              "${VER%%+*}" "${VER##*+}" >> local.properties
            echo "版本 ${VER%%+*}+${VER##*+}"
            # 只编 arm64 flavor（ABI 是 productFlavor，arm64Release 才是单 ABI）
            ./gradlew --no-daemon assembleArm64Release \
              -Punsigned -PskipDependencyChecks=true -Ptarget-platform=android-arm64
            APK=$(find ../build/app/outputs -path '*arm64*release*' -name '*.apk' | head -1)
            [ -n "$APK" ] || APK=$(find ../build/app/outputs -name '*release*.apk' | head -1)
            echo "APK=$APK"
            sha256sum "$APK"
            cp "$APK" ../../app-release-unsigned.apk
            ls -l ../../app-release-unsigned.apk

        - name: 回传未签名 APK（提交附件）
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./app-release-unsigned.apk"
