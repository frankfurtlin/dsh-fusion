main:
  push:
    - name: probe-flutter-install
      docker:
        image: ubuntu:24.04
      stages:
        - name: ubuntu 上装 flutter 并跑 --version
          script: |
            set -e
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq git curl unzip xz-utils >/dev/null 2>&1
            git clone --depth 1 --branch 3.50.0 https://mirrors.tuna.tsinghua.edu.cn/git/flutter-sdk.git /root/flutter
            git config --global --add safe.directory /root/flutter
            export PUB_HOSTED_URL=https://pub.flutter-io.cn
            export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
            /root/flutter/bin/flutter --version
            echo "=== flutter --version 成功 ==="
            echo DONE
