# CNB 云原生构建：Android release APK（未签名）
#
# 分工（2026-11-24 用户选定「方案 B」）：
#   CNB  —— 只负责编译，产出**未签名** APK，作为提交附件回传
#   本机 —— 用 release 密钥签名、校验、传 COS、更新清单（release.py）
# 签名密钥与 COS 凭据都不需要进 CI。
#
# 为什么在 CNB 构建：本机 2 核 / 8 GB 且常驻 DSH(1.5 GB)+Hermes，release 构建
# 峰值 3.5 GB 会把整机压进 swap，40 分钟才出包（docs/build.md §13）。
#
# 触发：main 分支 push（本地 `git push origin main` 同时推到 GitHub 与 CNB）。
#
# 踩过的坑（别再改回去）：
#  1. 预置镜像没有新版 Flutter：ghcr.io/cirruslabs/flutter 最新只到 3.44，
#     项目要 Dart ^3.13.4（Flutter 3.50.0），只能自己装。
#  2. 容器与数据卷的 overlay 对 tar 的某些操作返回 ENOSYS
#     （"Cannot open/mkdir: Function not implemented"），解压 Flutter 必挂
#     → 改用 git clone（TUNA 镜像）装 Flutter，并去掉 tar 路径。
#  3. 数据卷属主被 userns 重映射，/cache 不可写 → 探测后回退到 $HOME 缓存。
main:
  push:
    - name: android-release-unsigned
      docker:
        image: eclipse-temurin:17-jdk
        volumes:
          - /cache:read-write
      stages:
        - name: 安装工具链
          script: |
            set -e
            echo "user=$(id -u) home=$HOME"
            CACHE=/cache
            mkdir -p "$CACHE" 2>/dev/null || true
            if ! touch "$CACHE/.probe" 2>/dev/null; then
              CACHE="$HOME/.cnb-cache"
              mkdir -p "$CACHE"
              echo "==> /cache 不可写，改用 $CACHE"
            fi
            rm -f "$CACHE/.probe"

            export FLUTTER_HOME=/opt/flutter
            export ANDROID_HOME=/opt/android-sdk
            apt-get update -qq >/dev/null 2>&1 || true
            apt-get install -y -qq curl unzip xz-utils git file >/dev/null 2>&1 || true

            if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
              echo "==> 克隆 Flutter 3.50.0（TUNA 镜像）"
              rm -rf "$FLUTTER_HOME"
              git clone --depth 1 --branch 3.50.0 \
                https://mirrors.tuna.tsinghua.edu.cn/git/flutter-sdk.git "$FLUTTER_HOME"
              git config --global --add safe.directory "$FLUTTER_HOME"
            fi

            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              if [ ! -f "$CACHE/commandlinetools-linux.zip" ]; then
                echo "==> 下载 Android cmdline-tools"
                curl -fL --retry 3 -o "$CACHE/commandlinetools-linux.zip" \
                  https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              fi
              echo "==> 解压 Android cmdline-tools"
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              unzip -q "$CACHE/commandlinetools-linux.zip" -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
                "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            fi
            export PUB_HOSTED_URL=https://pub.flutter-io.cn
            export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
            "$FLUTTER_HOME/bin/flutter" --version

        - name: 构建 release（未签名）
          script: |
            set -e
            export PATH=/opt/flutter/bin:/opt/android-sdk/platform-tools:$PATH
            export ANDROID_HOME=/opt/android-sdk
            export ANDROID_SDK_ROOT=/opt/android-sdk
            export PUB_HOSTED_URL=https://pub.flutter-io.cn
            export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
            cd app
            flutter pub get
            flutter build apk --release --target-platform android-arm64 -Punsigned
            ls -lh build/app/outputs/flutter-apk/
            APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
            echo "APK=$APK"
            sha256sum "$APK"

        - name: 回传未签名 APK（提交附件）
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./app/build/app/outputs/flutter-apk/app-arm64-release-unsigned.apk"
