main:
  push:
    - name: probe-flutter-image
      docker:
        image: docker.cnb.cool/jacknic/docker/flutter
      stages:
        - name: 探测镜像里的工具链版本
          script: |
            set -x
            flutter --version
            echo "FLUTTER_ROOT=$(dirname $(dirname $(readlink -f $(which flutter))))"
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1 | head -3
            ls ${ANDROID_HOME:-/opt/android-sdk} 2>/dev/null | head
            echo "=== 试解 flutter 的 gradle-wrapper ==="
            TMP=$(mktemp -d); tar xzf /root/flutter/bin/cache/artifacts/gradle_wrapper/*.tgz -C "$TMP" 2>/dev/null || echo "(无现成 tgz，跳过)"
            echo DONE
