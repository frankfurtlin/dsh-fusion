name: Android APK

# 在 GitHub 的 4 核机器上构建，取代本机 2C8G 的 20–70 分钟构建。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        type: choice
        default: release
        options: [release, debug]
      abi:
        description: "目标 ABI（all = arm64 + x86_64，两个包都出）"
        type: choice
        default: all
        options: [all, android-arm64, android-x64]
  push:
    tags:
      - "v*"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  JAVA_VERSION: "17"
  APP_DIR: app

jobs:
  build:
    name: Build ${{ inputs.mode || 'release' }} · ${{ inputs.abi || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gradle 缓存：命中后 dex/R8 可以复用，首轮之后通常能省一半以上时间。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES，拒绝产出 debug 签名的包"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$APP_DIR/android/app/release.keystore"
          printf '%s\n' "$KEY_PROPERTIES" > "$APP_DIR/android/key.properties"
          chmod 600 "$APP_DIR/android/app/release.keystore" "$APP_DIR/android/key.properties"
          # key.properties 里的 storeFile 统一指向仓库内的相对路径
          sed -i 's|^storeFile=.*|storeFile=release.keystore|' "$APP_DIR/android/key.properties"

      - name: flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Resolve build flags
        id: flags
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'release' }}"
          ABI="${{ inputs.abi || 'all' }}"
          FLAGS="--$MODE --android-skip-build-dependency-validation"
          if [ "$ABI" != "all" ]; then
            FLAGS="$FLAGS --target-platform $ABI"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set +e
          flutter build apk ${{ steps.flags.outputs.flags }} 2>&1 | tee build-ci.log
          rc=${PIPESTATUS[0]}
          set -e

          # Flutter 3.5x 在本项目上会输出 per-ABI 的 APK（app-arm64-release.apk 等），
          # 然后找不到 app-release.apk 就返回 1。产物存在就按成功处理。
          apks=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          if [ "$rc" -ne 0 ] && [ "$apks" -gt 0 ]; then
            echo "::warning::flutter 返回 $rc（per-ABI 输出路径的老问题），但已产出 $apks 个 APK，按成功处理"
            exit 0
          fi
          echo "build_rc=$rc apks=$apks"
          exit "$rc"

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in "$APP_DIR"/build/app/outputs/flutter-apk/*.apk; do
            cp -f "$f" out/
          done
          ls -lh out || true

      - name: Publish APK to COS
        if: success() && inputs.mode == 'release'
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_EO_DOMAIN: ${{ secrets.COS_EO_DOMAIN }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          python3 -m pip install --quiet cos-python-sdk-v5
          python3 tools/pocket/publish_ci.py

      - name: Verify release signature
        if: always()
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "sdk=$SDK build-tools=${BT:-none}"
          fail=0
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")"
            if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
              out=$("$BT/apksigner" verify --print-certs "$f" 2>&1)
            else
              out=$(keytool -printcert -jarfile "$f" 2>&1 || true)
            fi
            echo "$out" | sed -n '1,8p'
            echo "$out" | grep -q "CN=dsh-Go" || { echo "::error::$f 未使用 dsh-Go 发布证书签名"; fail=1; }
            # apksigner prints the digest as bare lowercase hex, never with
            # colons — matching "E5:30:D8:AD" here failed every correctly
            # signed APK. Compare the full SHA-256 instead.
            echo "$out" | grep -qi "e530d8ad73cb6eafe4b9d3d6e44ac095acfd2d11a5f6c2742ce1c5d17031706f" \
              || { echo "::error::$f 证书指纹与发布密钥不一致"; fail=1; }
          done
          exit $fail

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fusion-${{ steps.flags.outputs.mode || 'release' }}-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ env.APP_DIR }}/build-ci.log
          retention-days: 7
