# 让 GitHub 自动生成的 release notes 按类型分组（`gh release create --generate-notes`）
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Performance
      labels: [performance]
    - title: Documentation
      labels: [docs]
    - title: Other changes
      labels: ['*']
  exclude:
    labels: [skip-changelog]
